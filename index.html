<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手写签名生成工具 · Signature Pad</title>
<meta name="description" content="免费开源、纯浏览器运行的手写签名生成工具，鼠标或触屏手写签名，导出透明背景PNG，可直接嵌入文档使用。不联网、不上传。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>手写<span class="accent">签名</span>生成工具</h1>
    <p class="tagline">用鼠标或触屏手写你的签名，选笔迹颜色和粗细，导出透明背景 PNG，可以直接贴到文档里用。全部本地完成，不联网、不上传。</p>
  </header>

  <main class="layout">
    <div class="controls">
      <div class="field">
        <label>笔迹颜色</label>
        <div class="color-row">
          <button class="color-btn active" data-color="#0A101E" style="background:#0A101E"></button>
          <button class="color-btn" data-color="#1D4ED8" style="background:#1D4ED8"></button>
          <button class="color-btn" data-color="#DC2626" style="background:#DC2626"></button>
        </div>
      </div>
      <div class="field">
        <label>笔迹粗细：<span id="widthVal">3</span></label>
        <input id="widthInput" type="range" min="1" max="8" step="0.5" value="3">
      </div>
      <button id="btnClear" class="btn btn-ghost">清空重写</button>
      <button id="btnExport" class="btn btn-primary">导出 PNG ↓</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="700" height="300"></canvas>
      <p class="hint">在上面的区域手写签名</p>
    </div>
  </main>

  <footer class="footer">
    <p>MIT 协议开源，签名全程本地绘制，不联网、不上传，导出的图片背景透明。</p>
    <p>想要在线发起签约、实名认证、区块链存证的完整电子签约系统？<a href="https://inzyxuashop.com/dianziqianyue-yuanma.html" target="_blank" rel="noopener">看看完整版电子签约源码 →</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
